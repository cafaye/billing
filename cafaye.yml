# cafaye.yml — the cafaye project manifest for billing.
#
# Conforms to core's frozen schema
# (cafaye/core: schemas/cafaye.manifest.schema.json). Specs are manager-owned:
# a worker records the shape it is being built against and marks what it cannot
# decide. See AGENTS.md.
#
# > `exposes` now names the eight events this build publishes, in the
# > three-segment form core v0.2 made mandatory (D1): three from the models and
# > five from the Stripe webhook mapping. One cross-repo obligation follows from
# > it and cannot be discharged from this worktree, because core is read-only
# > here:
# >
# > * `billing.plan.created` and `billing.customer.created` already have catalog
# >   rows in core's docs/event-naming.md.
# > * `billing.plan.updated` does not, and core's suite cannot catch that for
# >   this repository: `tests/test_specs.py` asserts the catalog rule over core's
# >   own `examples/valid/*.cafaye.yml`, and `caf contract lint` — which would
# >   check a service's real manifest — does not exist yet. So the row is a
# >   review obligation rather than a currently-failing test. The entity is
# >   already catalogued and `updated` is already in core's action vocabulary, so
# >   the row is a one-line addition to core's billing table. Until it lands,
# >   `test/contract/outbox_envelope_contract_test.rb` carries the obligation in
# >   code, so a *new* event published without a catalog row still fails here.
# >
# > Three more gaps are recorded here rather than fixed:
# >
# > 1. `bad_request`, `cursor_invalid` and `cursor_expired` are problem codes this
# >    service answers with that core's reserved list does not name. 400 is absent
# >    from the list entirely and `cursor_expired` appears only in the pagination
# >    prose, so all three need adding before another service copies them.
# > 2. The two probes (/healthz, /readyz) are deliberately not declared. They are
# >    infrastructure, not contract surface, and guard left the same gap for the
# >    same reason.
# > 3. No payload schema exists in core for the three events the models emit.
# >    core's outbox checklist asks for `data` to be validated against
# >    `schemas/events/<service>/<entity>/<action>.schema.json` before the insert,
# >    and core ships only two payload schemas in total. `test/contract` enforces
# >    the rule for any event that has one, and skips the three that do not, so
# >    the moment a schema lands this service is checked against it. The five
# >    webhook events are a separate and larger gap, recorded in the
# >    DECISION NEEDED below.
# >
# > `consumes` is empty and `dependencies` is empty. The customers created here
# > reference identity's users and accounts by uuid, which is a data dependency
# > rather than a call — this build never asks identity anything, and declaring a
# > dependency on a service that is not called would have `caf` start it for
# > nothing.
# >
# > DECISION NEEDED (billing-03, on `subject`): the envelope's `subject` is the
# > entity the event is about, and for a subscription or a payment this build has
# > no id of its own — there is no subscriptions table. So a subscription or
# > payment event carries Stripe's subscription id when the payload has one and
# > Stripe's customer id otherwise. Two costs: a consumer cannot join these events
# > to a cafaye account without the mapping, and when a subscriptions table lands
# > the subject changes, which is a semantic change to every event already
# > published. The alternative — emitting cafaye ids that do not exist yet — is
# > worse. Recommendation: land a subscriptions table before the first real
# > customer, and treat the change as a versioned event payload rather than a new
# > type, per core's evolution table. Manager decides; flipping it is one line in
# > `Webhooks::StripeEvents.subject_for`.
# >
# > DECISION NEEDED (billing-03, on `checkout.session.completed`): the packet
# > asked for a `billing.checkout.completed` event. core's catalog has no such
# > row, and core's rules say the catalog is the registry and the manifest must
# > agree with it in both directions — so declaring one here would be a contract
# > drift the manager has not agreed to, and a consumer would have nothing to
# > validate against. This build therefore emits `billing.payment.succeeded` for a
# > one-time Checkout session (the only record of that charge) and deliberately
# > ignores a subscription-mode session, which restates
# > `customer.subscription.created` and would otherwise count every Checkout
# > signup twice. If the manager wants a distinct `checkout.completed`, it needs a
# > catalog row in core first, and the mapping is then one line in
# > `Webhooks::StripeEvents.event_type_for`.
# >
# > DECISION NEEDED (billing-03, on payload schemas): core ships one payload
# > schema for billing —
# > `schemas/events/billing/subscription/started.schema.json` — and this build
# > does not satisfy it. It requires `plan_id` and `account_id`, which are
# > `pln_…` and `acc_…` ids this service does not have and cannot invent, and it
# > is closed with `additionalProperties: false` over eight fields, so the eleven
# > this service actually sends are unexpected to it. Emitting the event anyway is
# > the right call: the catalog row exists, the envelope is core-shaped, and a
# > payload a consumer cannot read is a gap in core rather than a reason to stop
# > publishing. The exact difference is asserted in
# > `test/contract/outbox_envelope_contract_test.rb` as
# > `PENDING_PAYLOAD_ALIGNMENT`, so the day the payload changes this file has to
# > change with it. Closing it is a core-side decision plus a subscriptions
# > table.
name: billing
description: Plans, subscriptions, prepaid credit, usage metering, webhooks in.
language: ruby
core: ^0.2.0

exposes:
  api: openapi/v1.yaml
  events:
    # Three segments, prefixed with this service's own name, which is what core's
    # manifest conventions require of a long-form type. `customer.created` in
    # core's catalog is the two-segment form and is a *different* type: the
    # catalog row has to be renamed, not reused.
    #
    # The list is the union of what the models emit and what the Stripe webhook
    # mapping emits, and it is asserted to be the same list as
    # `OutboxEvent::TYPES` in `test/contract/`. Nothing else is here on purpose:
    # core's catalog lists more for billing (subscription.past_due,
    # payment.refunded, invoice.created, usage.recorded), and naming a type this
    # build never publishes would tell `caf` to wire a consumer for a message
    # that does not exist.
    - billing.customer.created
    - billing.payment.failed
    - billing.payment.succeeded
    - billing.plan.created
    - billing.plan.updated
    - billing.subscription.canceled
    - billing.subscription.started
    - billing.subscription.updated

# billing subscribes to no events yet. The customers and subscriptions that
# would react to identity's user and account events are later packets, and
# declaring an event this build does not handle would tell `caf` to wire a
# consumer that has nothing to do.
consumes: []

# No service-level dependencies yet. Stripe is a vendor, not a cafaye service,
# and belongs in the Gemfile rather than here (convention rule 4). identity
# becomes a dependency when billing needs to ask who a customer is.
dependencies: []

repository:
  url: git@github.com:cafaye/billing.git
  defaultBranch: master
  visibility: public

owner:
  team: billing
  contact: billing@cafaye.com
